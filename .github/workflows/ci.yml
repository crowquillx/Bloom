name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_tests:
        description: Also build and run the Windows test suite
        type: boolean
        default: false

# Only pull requests cancel superseded runs. A cancelled main or tag run could
# stop the release job after it deleted dev-latest or pushed a manifest.
concurrency:
  group: bloom-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CACHIX_CACHE: crowquillx-bloom

jobs:
  metadata:
    name: Determine build metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      build_id: ${{ steps.metadata.outputs.build_id }}
      git_sha: ${{ steps.metadata.outputs.git_sha }}
      is_tagged_release: ${{ steps.metadata.outputs.is_tagged_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve event metadata
        id: metadata
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          if [[ "$REF" == refs/tags/v* ]]; then
            if [[ "$REF_NAME" != "v$VERSION" ]]; then
              echo "Tag $REF_NAME does not match VERSION ($VERSION)." >&2
              exit 1
            fi
            CHANNEL="stable"
            BUILD_ID="$VERSION"
            IS_TAGGED_RELEASE="true"
          else
            CHANNEL="dev"
            BUILD_ID="$(date -u +%Y%m%d%H%M%S)-${SHA::7}"
            IS_TAGGED_RELEASE="false"
          fi
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "build_id=$BUILD_ID"
            echo "git_sha=$SHA"
            echo "is_tagged_release=$IS_TAGGED_RELEASE"
          } >> "$GITHUB_OUTPUT"

  # Each group compiles Bloom separately, so the groups run on their own runners
  # instead of serializing three full builds on one.
  nix:
    name: Nix build and validation (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: app
            checks: bloom release-smoke seek-preview-no-scripting mpv-fel-capability
          - group: tests
            checks: tests
          - group: lint
            checks: qml-lint automation-lint metadata release-manifest dependency-pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - name: Build ${{ matrix.group }} checks
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          set -euo pipefail
          # cache.nixos.org nar downloads occasionally drop mid-transfer on
          # GitHub-hosted runners (broken pipe / HTTP 416 on resumed ranges),
          # which cascades through mpv/qtmultimedia and fails unrelated
          # derivations. Retry the whole nix invocation with backoff so a
          # transient substituter failure does not fail the run. Only Nix's
          # own error lines are inspected (builder output is prefixed
          # with "<drv>>"), so failing builds and tests fail on the first
          # attempt instead of rebuilding three times.
          transient='unable to download|cannot download|substitutes? for|HTTP error|Broken pipe|Connection reset|Timeout was reached|transfer closed|Could not resolve host|SSL'
          retry() {
            local attempt=0 max=3 delay=20 log
            log="$(mktemp)"
            until "$@" 2>&1 | tee "$log"; do
              attempt=$((attempt + 1))
              if ! grep -qiE "^error: .*(${transient})" "$log"; then
                echo "::error::nix build failed with a non-transient error; not retrying: $*" >&2
                return 1
              fi
              if [[ $attempt -ge $max ]]; then
                echo "::error::nix build failed after $attempt attempts: $*" >&2
                return 1
              fi
              echo "::warning::nix build attempt $attempt failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          targets=()
          for check in $CHECKS; do
            targets+=(".#checks.x86_64-linux.$check")
          done
          retry nix build "${targets[@]}" \
            --print-build-logs --option max-jobs 1 --option cores 4
      - name: Pin current main build
        if: matrix.group == 'app' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          store_path="$(nix build .#bloom --no-link --print-out-paths)"
          cachix push "$CACHIX_CACHE" "$store_path"
          cachix pin "$CACHIX_CACHE" latest "$store_path" --keep-revisions 1

  portable-linux:
    name: Portable Linux artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: metadata
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Validate Docker packaging environment
        run: |
          docker version
          image="$(jq -r .portable.image packaging/dependencies.json)"
          image="${image#docker://}"
          docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image" >/dev/null
      - name: Cache portable mpv stack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-cache/bloom-mpv.tar
          key: portable-mpv-${{ hashFiles('packaging/portable/build-mpv.sh', 'packaging/dependencies.json') }}
      - name: Restore portable compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-cache/ccache
          key: portable-ccache-${{ github.run_id }}
          restore-keys: portable-ccache-
      - name: Build AppImage, deb, and tarball
        env:
          BLOOM_PORTABLE_CACHE_DIR: ${{ runner.temp }}/portable-cache
          BLOOM_CONTAINER_ENGINE: docker
          BLOOM_BUILD_CHANNEL: ${{ needs.metadata.outputs.channel }}
          BLOOM_BUILD_ID: ${{ needs.metadata.outputs.build_id }}
          BLOOM_GIT_SHA: ${{ needs.metadata.outputs.git_sha }}
        run: nix run .#package-linux -- --output dist
      - name: Save portable compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portable-cache/ccache
          key: portable-ccache-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Bloom-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS-linux-x86_64.txt
          if-no-files-found: error

  flatpak:
    name: Flatpak artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: metadata
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Enable Flatpak build sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - name: Validate Flatpak build sandbox
        run: |
          nix shell --inputs-from . nixpkgs#bubblewrap --command \
            bwrap --unshare-user --unshare-net --ro-bind / / true
      # Dependency stages (FFmpeg, libplacebo, mpv, ...) only change with the
      # manifest or pins, so this cache is saved once per dependency set.
      - name: Cache Flatpak dependency stages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
            .flatpak-builder/git
          key: flatpak-stages-${{ hashFiles('packaging/flatpak/com.github.crowquillx.Bloom.yml', 'packaging/dependencies.json') }}
      - name: Restore Flatpak compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder/ccache
          key: flatpak-ccache-${{ github.run_id }}
          restore-keys: flatpak-ccache-
      - name: Build Flatpak bundle
        env:
          BLOOM_BUILD_CHANNEL: ${{ needs.metadata.outputs.channel }}
          BLOOM_BUILD_ID: ${{ needs.metadata.outputs.build_id }}
          BLOOM_GIT_SHA: ${{ needs.metadata.outputs.git_sha }}
        run: nix run .#package-flatpak -- --output dist
      - name: Save Flatpak compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder/ccache
          key: flatpak-ccache-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Bloom-Flatpak
          path: |
            dist/*.flatpak
            dist/SHA256SUMS-flatpak-x86_64.txt
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 90
    needs: metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Shipped binaries are built without tests (BUILD_TESTING=OFF).
      - uses: ./.github/actions/windows-build
        with:
          build-dir: build-windows
          install-dir: install-windows
          channel: ${{ needs.metadata.outputs.channel }}
          build-id: ${{ needs.metadata.outputs.build_id }}
          git-sha: ${{ needs.metadata.outputs.git_sha }}
      - name: Save compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\sccache
          key: sccache-windows-${{ github.run_id }}
      - name: Package portable build
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -InstallDir install-windows `
            -OutputDir Bloom-Windows -QtDir "$env:QT_ROOT_DIR"
          Compress-Archive Bloom-Windows/* Bloom-Windows.zip -Force
      - uses: ./.github/actions/setup-nsis
      - name: Build installer
        shell: pwsh
        env:
          BLOOM_VERSION: ${{ needs.metadata.outputs.version }}
        run: '& "$env:BLOOM_NSIS_EXE" "/DVERSION=$env:BLOOM_VERSION" installer.nsi'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Bloom-Windows
          path: |
            Bloom-Windows.zip
            Bloom-Setup-*.exe
          if-no-files-found: error

  # Stable releases only (or on demand through workflow_dispatch): builds the
  # Windows test suite in its own tree, so the shipped binaries from the
  # windows job never contain test code, and gates the stable release on it.
  # Pull requests and main pushes skip this job and never wait for it.
  windows-tests:
    name: Windows tests (stable release)
    runs-on: windows-2025
    timeout-minutes: 120
    needs: metadata
    if: needs.metadata.outputs.is_tagged_release == 'true' || inputs.windows_tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-build
        with:
          build-dir: build-windows-tests
          install-dir: install-windows-tests
          build-tests: 'true'
          channel: ${{ needs.metadata.outputs.channel }}
          build-id: ${{ needs.metadata.outputs.build_id }}
          git-sha: ${{ needs.metadata.outputs.git_sha }}
      - name: Run Windows tests
        shell: pwsh
        run: |
          ./scripts/run-windows-tests.ps1 -BuildDir build-windows-tests `
            -InstallDir install-windows-tests -Config Release -OutputOnFailure

  # The release is published as soon as validation and the Windows build pass,
  # so the Windows updater and Scoop never wait on Linux packaging. Linux and
  # Flatpak assets are attached by the release-linux and release-flatpak jobs
  # when their builds finish; a failing Flatpak build no longer blocks release.
  # Stable tags also wait for windows-tests. Elsewhere it is skipped, which
  # would skip this job too without the explicit result checks below.
  release:
    name: Publish release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [metadata, nix, windows, windows-tests]
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      needs.metadata.result == 'success' &&
      needs.nix.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.windows-tests.result == 'success' ||
        (needs.windows-tests.result == 'skipped' && needs.metadata.outputs.is_tagged_release != 'true'))
    concurrency:
      group: bloom-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Bloom-Windows
          path: release-assets
      - name: Prepare release metadata and assets
        id: release
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD_ID: ${{ needs.metadata.outputs.build_id }}
          IS_TAGGED_RELEASE: ${{ needs.metadata.outputs.is_tagged_release }}
        run: |
          set -euo pipefail
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$IS_TAGGED_RELEASE" == "true" ]]; then
            TAG="$GITHUB_REF_NAME"
            RELEASE_NAME="Bloom $GITHUB_REF_NAME"
            NOTES_FILE="RELEASE_NOTES.md"
            INSTALLER="$(find release-assets -maxdepth 1 -name 'Bloom-Setup-*.exe' -printf '%f\n' | head -1)"
            PRERELEASE="false"
            MAKE_LATEST="true"
          else
            TAG="dev-latest"
            RELEASE_NAME="Development Build"
            PRERELEASE="true"
            MAKE_LATEST="false"
            mv release-assets/Bloom-Setup-*.exe release-assets/Bloom-Setup-dev.exe
            INSTALLER="Bloom-Setup-dev.exe"
            NOTES_FILE="dev-release-notes.md"
            cat > "$NOTES_FILE" <<EOF
          Latest development build from the \`main\` branch.

          - Build ID: \`$BUILD_ID\`
          - Commit: \`$GITHUB_SHA\`
          - Base version: \`$VERSION\`
          - Built: \`$PUBLISHED_AT\`

          Linux and Flatpak assets are attached when their builds finish.
          EOF
            git tag -f dev-latest "$GITHUB_SHA"
            git push origin refs/tags/dev-latest --force
          fi
          {
            echo "tag=$TAG"
            echo "name=$RELEASE_NAME"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "notes_file=$NOTES_FILE"
            echo "installer=$INSTALLER"
            echo "published_at=$PUBLISHED_AT"
          } >> "$GITHUB_OUTPUT"
      - name: Generate combined checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\0' |
            sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.exe
      - name: Remove previous development release
        if: needs.metadata.outputs.is_tagged_release != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: "dev-latest"
              });
            } catch (error) {
              if (error.status === 404) {
                core.info("dev-latest release does not exist yet.");
                return;
              }
              throw error;
            }
            core.info(`Deleting previous dev-latest release ${release.data.id}`);
            await github.rest.repos.deleteRelease({
              owner,
              repo,
              release_id: release.data.id
            });
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          body_path: ${{ steps.release.outputs.notes_file }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          overwrite_files: true
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Generate Windows update manifest
        id: manifest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
          BUILD_ID: ${{ needs.metadata.outputs.build_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INSTALLER: ${{ steps.release.outputs.installer }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          MANIFEST_SIGNING_KEY_B64: ${{ secrets.BLOOM_UPDATE_MANIFEST_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$MANIFEST_SIGNING_KEY_B64" ]]; then
            echo "BLOOM_UPDATE_MANIFEST_SIGNING_KEY_B64 is not configured" >&2
            exit 1
          fi
          SIGNING_KEY_FILE="$RUNNER_TEMP/bloom-update-signing-key.pem"
          trap 'shred -u "$SIGNING_KEY_FILE" 2>/dev/null || rm -f "$SIGNING_KEY_FILE"' EXIT
          install -m 600 /dev/null "$SIGNING_KEY_FILE"
          printf '%s' "$MANIFEST_SIGNING_KEY_B64" | base64 --decode > "$SIGNING_KEY_FILE"
          PORTABLE="Bloom-Windows.zip"
          INSTALLER_HASH="$(sha256sum "release-assets/$INSTALLER" | cut -d' ' -f1)"
          PORTABLE_HASH="$(sha256sum "release-assets/$PORTABLE" | cut -d' ' -f1)"
          python3 scripts/generate-update-manifest.py \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --build-id "$BUILD_ID" \
            --release-tag "$RELEASE_TAG" \
            --published-at "$PUBLISHED_AT" \
            --notes-file "$NOTES_FILE" \
            --installer-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$INSTALLER" \
            --installer-filename "$INSTALLER" \
            --installer-sha256 "$INSTALLER_HASH" \
            --portable-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$PORTABLE" \
            --portable-filename "$PORTABLE" \
            --portable-sha256 "$PORTABLE_HASH" \
            --minimum-supported-version "$VERSION" \
            --key-id "bloom-update-2026-08" \
            --signing-key-file "$SIGNING_KEY_FILE" \
            --output "$CHANNEL.json"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" manifest-repo
          cd manifest-repo
          if git ls-remote --exit-code --heads origin update-manifests >/dev/null 2>&1; then
            git checkout update-manifests
          else
            git checkout --orphan update-manifests
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "../${{ steps.manifest.outputs.channel }}.json" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.manifest.outputs.channel }}.json"
          git commit -m "chore: update ${{ steps.manifest.outputs.channel }} manifest" || true
          git push origin update-manifests
      - name: Update Scoop manifest
        env:
          SCOOP_REPO_TOKEN: ${{ secrets.SCOOP_REPO_TOKEN }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          set -euo pipefail
          if [[ -z "$SCOOP_REPO_TOKEN" ]]; then
            echo "SCOOP_REPO_TOKEN is required to update crowquillx/scoop-bloom." >&2
            exit 1
          fi

          ZIP="Bloom-Windows.zip"
          ZIP_HASH="$(sha256sum "release-assets/$ZIP" | cut -d' ' -f1)"
          ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ZIP}"

          if [[ "$CHANNEL" == "stable" ]]; then
            EVENT_TYPE="update-stable-manifest"
            SCOOP_VERSION="$VERSION"
          else
            EVENT_TYPE="update-manifest"
            SCOOP_VERSION="$(date -u -d "$PUBLISHED_AT" +%Y.%m.%d.%H%M)"
          fi

          PAYLOAD="$(jq -cn \
            --arg event_type "$EVENT_TYPE" \
            --arg hash "$ZIP_HASH" \
            --arg url "$ZIP_URL" \
            --arg version "$SCOOP_VERSION" \
            '{event_type:$event_type,client_payload:{hash:$hash,url:$url,version:$version}}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $SCOOP_REPO_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/crowquillx/scoop-bloom/dispatches" \
            --data "$PAYLOAD"

  release-linux:
    name: Attach Linux release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [metadata, release, portable-linux]
    # The implicit success() also fails when an indirect dependency such as
    # windows-tests was skipped, so check the direct dependencies instead.
    if: >-
      !cancelled() &&
      needs.metadata.result == 'success' &&
      needs.release.result == 'success' &&
      needs.portable-linux.result == 'success'
    # Serializes with release-flatpak so both can merge SHA256SUMS.txt safely.
    concurrency:
      group: bloom-release-assets-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Bloom-Linux
          path: release-assets
      - name: Apply development asset names
        if: needs.metadata.outputs.is_tagged_release != 'true'
        working-directory: release-assets
        run: |
          set -euo pipefail
          mv Bloom-*-linux-x86_64.AppImage Bloom-x86_64.AppImage
          mv Bloom-*-linux-x86_64.tar.gz Bloom-Linux.tar.gz
          mv bloom_*_amd64.deb bloom_dev_amd64.deb
          sha256sum \
            Bloom-x86_64.AppImage \
            Bloom-Linux.tar.gz \
            bloom_dev_amd64.deb > SHA256SUMS-linux-x86_64.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.tar.gz
      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ./scripts/publish-release-assets.sh "$TAG" \
            release-assets/*.AppImage \
            release-assets/*.deb \
            release-assets/*.tar.gz \
            release-assets/SHA256SUMS-linux-x86_64.txt

  release-flatpak:
    name: Attach Flatpak release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [metadata, release, flatpak]
    if: >-
      !cancelled() &&
      needs.metadata.result == 'success' &&
      needs.release.result == 'success' &&
      needs.flatpak.result == 'success'
    concurrency:
      group: bloom-release-assets-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Bloom-Flatpak
          path: release-assets
      - name: Apply development asset names
        if: needs.metadata.outputs.is_tagged_release != 'true'
        working-directory: release-assets
        run: |
          set -euo pipefail
          mv Bloom-*-linux-x86_64.flatpak Bloom-x86_64.flatpak
          sha256sum Bloom-x86_64.flatpak > SHA256SUMS-flatpak-x86_64.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.flatpak
      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ./scripts/publish-release-assets.sh "$TAG" \
            release-assets/*.flatpak \
            release-assets/SHA256SUMS-flatpak-x86_64.txt
