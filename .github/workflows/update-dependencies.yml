name: Update dependencies

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

# A second run waits instead of racing the first on the update branch.
concurrency:
  group: bloom-update-dependencies
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CACHIX_CACHE: crowquillx-bloom

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # Read-only outside main; only main runs may push to the binary cache.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      - name: Refresh flake inputs
        run: nix flake update
      - name: Validate updated inputs
        env:
          BLOOM_BUILD_JOBS: '2'
        run: |
          nix build \
            .#checks.x86_64-linux.automation-lint \
            .#checks.x86_64-linux.qml-lint \
            .#checks.x86_64-linux.tests \
            .#checks.x86_64-linux.metadata \
            .#checks.x86_64-linux.release-manifest \
            .#checks.x86_64-linux.release-smoke \
            .#checks.x86_64-linux.mpv-fel-capability \
            .#checks.x86_64-linux.dependency-pins \
            .#bloom \
            --print-build-logs --option max-jobs 1 --option cores 2
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          branch: automation/update-dependencies
          delete-branch: true
          commit-message: 'chore(deps): update pinned dependencies'
          title: 'chore(deps): update pinned dependencies'
          body: |
            Weekly dependency refresh.

            The flake lock was updated and the build, deterministic tests, and validation checks passed.
            Portable, Flatpak, Windows, and GitHub Actions pins remain explicit
            in `packaging/dependencies.json` and Dependabot.
          labels: dependencies
