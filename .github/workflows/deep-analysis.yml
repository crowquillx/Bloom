name: Deep analysis

on:
  schedule:
    - cron: '41 7 * * 0'
  workflow_dispatch:

concurrency:
  group: bloom-deep-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHIX_CACHE: crowquillx-bloom

jobs:
  clang-tidy:
    name: Targeted clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Read-only outside main; only main runs may push to the binary cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      - name: Analyze ownership and security boundaries
        env:
          BLOOM_BUILD_JOBS: '4'
        run: nix develop .#analysis --command ./scripts/run-clang-tidy.sh

  sanitizers:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: address
            label: ASan and UBSan
          - mode: thread
            label: Targeted TSAN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Read-only outside main; only main runs may push to the binary cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      - name: Build and run instrumented tests
        env:
          BLOOM_BUILD_JOBS: '4'
        run: nix develop .#analysis --command ./scripts/run-sanitizers.sh '${{ matrix.mode }}'

  coverage:
    name: Coverage report
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Read-only outside main; only main runs may push to the binary cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      - name: Build tests and collect coverage
        env:
          BLOOM_BUILD_JOBS: '4'
        run: nix develop .#analysis --command ./scripts/run-coverage.sh
      - name: Add coverage to run summary
        run: |
          {
            echo '## Bloom coverage'
            echo '```text'
            cat build-analysis/coverage-report/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bloom-coverage-${{ github.sha }}
          path: build-analysis/coverage-report
          if-no-files-found: error
          retention-days: 90
