name: Windows build
description: >-
  Installs the pinned Qt and mpv SDKs, restores the sccache directory, and
  builds and installs Bloom with scripts/build.ps1 inside the MSVC x64 shell.
inputs:
  build-dir:
    description: CMake build directory
    required: true
  install-dir:
    description: CMake install directory
    required: true
  build-tests:
    description: Configure and build the deterministic test targets (true/false)
    required: false
    default: 'false'
  channel:
    description: Build channel metadata (stable or dev)
    required: true
  build-id:
    description: Build identifier metadata
    required: true
  git-sha:
    description: Git commit metadata
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Read dependency pins
      shell: pwsh
      run: |
        $deps = Get-Content packaging/dependencies.json -Raw | ConvertFrom-Json
        "BLOOM_QT_VERSION=$($deps.qt.version)" >> $env:GITHUB_ENV
        "BLOOM_QT_ARCH=$($deps.qt.windows_arch)" >> $env:GITHUB_ENV
    - name: Cache Qt SDK
      id: cache-qt
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}\Qt
        key: qt-${{ env.BLOOM_QT_VERSION }}-${{ env.BLOOM_QT_ARCH }}-${{ hashFiles('packaging/dependencies.json') }}
    - name: Cache mpv SDK
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Cache only the pinned archive. build.ps1 verifies its SHA-256 before
        # extracting it, so restored cache contents never bypass validation.
        path: third_party\mpv\*.7z
        key: mpv-sdk-archive-${{ runner.os }}-${{ hashFiles('packaging/dependencies.json') }}
    - name: Install Qt
      if: steps.cache-qt.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        # aqtinstall 3.3.0 cannot install Qt 6.11+ on Windows (repo layout
        # changed); use the fix on master until 3.3.1 is released.
        python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@bbfb1f7c0590b9eb3fa91356e75bb64fb15d3643" "py7zr==1.0.*"
        python -m aqt install-qt -O "$env:RUNNER_TOOL_CACHE\Qt" windows desktop `
          "$env:BLOOM_QT_VERSION" "$env:BLOOM_QT_ARCH" `
          -m qtmultimedia qtshadertools qtimageformats qt5compat
    - name: Configure Qt environment
      shell: pwsh
      run: |
        # aqtinstall installs to <outputdir>/<version>/<arch-dir>/ where
        # <arch-dir> drops the "win64_" prefix from the package selector.
        $qtArchDir = $env:BLOOM_QT_ARCH -replace '^win64_', ''
        $qtRoot = Join-Path $env:RUNNER_TOOL_CACHE "Qt\$env:BLOOM_QT_VERSION\$qtArchDir"
        if (-not (Test-Path "$qtRoot\lib\cmake\Qt6\Qt6Config.cmake")) {
          throw "Qt6Config.cmake not found under $qtRoot"
        }
        "QT_ROOT_DIR=$qtRoot" >> $env:GITHUB_ENV
        "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
        "$qtRoot\bin" >> $env:GITHUB_PATH
    - name: Install build tools
      shell: pwsh
      run: choco install ninja 7zip -y --no-progress
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
    # Only main pushes save compiler caches (see the windows job), so pull
    # requests and tags reuse the latest main cache without filling the quota.
    - name: Restore compiler cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}\sccache
        key: sccache-windows-${{ github.run_id }}
        restore-keys: sccache-windows-
    - name: Build and install
      shell: pwsh
      env:
        # Release flags carry no /Zi, so every MSVC compile is cacheable.
        # Build metadata reaches only the few files that include version.h.
        CMAKE_C_COMPILER_LAUNCHER: sccache
        CMAKE_CXX_COMPILER_LAUNCHER: sccache
        SCCACHE_DIR: ${{ runner.temp }}\sccache
        SCCACHE_CACHE_SIZE: 1G
        BLOOM_BUILD_DIR: ${{ inputs.build-dir }}
        BLOOM_INSTALL_DIR: ${{ inputs.install-dir }}
        BLOOM_BUILD_TESTS: ${{ inputs.build-tests }}
        BLOOM_BUILD_CHANNEL: ${{ inputs.channel }}
        BLOOM_BUILD_ID: ${{ inputs.build-id }}
        BLOOM_GIT_SHA: ${{ inputs.git-sha }}
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
        $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vsPath) { throw "No Visual Studio installation with MSVC x64 tools was found" }
        $devShell = Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
        if (-not (Test-Path $devShell)) { throw "VS DevShell module not found at $devShell" }
        Import-Module $devShell
        Enter-VsDevShell -VsInstallPath $vsPath -Arch x64 -HostArch x64 -SkipAutomaticLocation
        if (-not (Get-Command cl -ErrorAction SilentlyContinue)) { throw "MSVC compiler (cl.exe) is not on PATH after Enter-VsDevShell" }
        ./scripts/build.ps1 -BuildDir "$env:BLOOM_BUILD_DIR" -InstallDir "$env:BLOOM_INSTALL_DIR" `
          -QtDir "$env:QT_ROOT_DIR" -Generator Ninja `
          -BuildChannel "$env:BLOOM_BUILD_CHANNEL" `
          -BuildId "$env:BLOOM_BUILD_ID" `
          -GitSha "$env:BLOOM_GIT_SHA" -Clean -RequireFelCapableMpv `
          -BuildTests:($env:BLOOM_BUILD_TESTS -eq 'true')
        # Stopping the server prints the hit rate and flushes the cache to disk.
        sccache --stop-server
