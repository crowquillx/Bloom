app-id: com.github.crowquillx.Bloom
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: bloom
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --env=BLOOM_FLATPAK=1
modules:
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=true
      - -Dbuild-date=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Duchardet=disabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dmanpage-build=disabled
      - -Dtests=false
    # Pinned post-PR-#17932 stack (Dolby Vision Profile 7 FEL). Revisions must
    # match packaging/dependencies.json; `nix flake check` (dependency-pins)
    # enforces this. A git source keeps `git describe` in `mpv --version`.
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        commit: dde0671072723c311df874a32dc4e48b5197ca62
    post-install:
      # Fail the build if the runtime cannot parse the FEL option.
      - /app/bin/mpv --no-config --vf=format=dolbyvision=yes:enhancement-layer=yes --version
    modules:
      - name: wayland-protocols
        buildsystem: meson
        config-opts:
          - -Dtests=false
        cleanup:
          - '*'
        sources:
          - type: archive
            url: https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.45/downloads/wayland-protocols-1.45.tar.xz
            sha256: 4d2b2a9e3e099d017dc8107bf1c334d27bb87d9e4aff19a0c8d856d17cd41ef0
      - name: nv-codec-headers
        no-autogen: true
        make-install-args:
          - PREFIX=/app
        cleanup:
          - '*'
        sources:
          - type: archive
            url: https://github.com/FFmpeg/nv-codec-headers/releases/download/n12.2.72.0/nv-codec-headers-12.2.72.0.tar.gz
            sha256: c295a2ba8a06434d4bdc5c2208f8a825285210d71d91d572329b2c51fd0d4d03
      # FFmpeg 9.0 is the first release with the `dovi_split` BSF that mpv
      # needs to split the Profile 7 EL. Installed under /app with its own
      # sonames, so it does not replace the runtime FFmpeg used by Qt.
      - name: zimg
        config-opts:
          - --disable-static
        post-install:
          - install -Dm644 COPYING /app/share/licenses/zimg/COPYING
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: archive
            url: https://github.com/sekrit-twc/zimg/archive/refs/tags/release-3.0.6.tar.gz
            sha256: be89390f13a5c9b2388ce0f44a5e89364a20c1c57ce46d382b1fcc3967057577
      - name: ffmpeg
        config-opts:
          - --enable-shared
          - --disable-static
          - --disable-programs
          - --disable-doc
          - --disable-debug
          - --enable-gnutls
          - --enable-libdav1d
          - --enable-libdrm
          - --enable-vaapi
          - --enable-ffnvcodec
          - --enable-nvdec
          - --enable-libzimg
          - --disable-vulkan
        cleanup:
          - /include
          - /lib/pkgconfig
          - /share/ffmpeg
        sources:
          - type: archive
            url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
            sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
      - name: libass
        config-opts:
          - --disable-static
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
            sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a
      # libplacebo API >= 370 (FEL composition) is not in a release yet.
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dvulkan=disabled
          - -Dshaderc=disabled
          - -Ddemos=false
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: git
            url: https://github.com/haasn/libplacebo.git
            commit: 0df80ae5229e8e520c0fa4e3d666098a3ffa1cbc
  - name: bloom
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_TESTING=OFF
      - -DBLOOM_BUILD_CHANNEL=stable
    sources:
      - type: dir
        path: ../..
    post-install:
      - test -x /app/bin/bloom-seek-preview
      - /app/bin/bloom-seek-preview --self-test
